[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project]
name = "gsebm"
version = "0.1.0"
description = "Python port of the Ghil-Sellers Energy Balance Model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "koopman-response",
    "marimo>=0.23.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "xarray>=2024.6",
]

[tool.uv.workspace]
members = [
    "external/Koopman-Dynamical-Response",
]

[tool.uv.sources]
koopman-response = { workspace = true, editable = true }
